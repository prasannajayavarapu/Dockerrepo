<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaHub - Movie Ticket Booking</title>
    <style>
        :root {
            --bg: #0a0a14;
            --card: #1a1a2e;
            --accent: #e50914;
            --accent2: #f5c518;
            --text: #f0f0f0;
            --muted: #aaa;
            --available: #2d2d44;
            --selected: #e50914;
            --occupied: #444;
            --radius: 16px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image: radial-gradient(ellipse at 20% 50%, #1a1a3e 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, #2d1b3d 0%, transparent 50%);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 30px 0 20px;
            animation: fadeDown 0.6s ease;
        }
        header h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #e50914, #f5c518);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header p {
            color: var(--muted);
            font-size: 1.05rem;
            margin-top: 4px;
        }
        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* Movies */
        .movies-section h2,
        .showtime-section h2,
        .seats-section h2 {
            font-size: 1.4rem;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }
        .movie-card {
            background: var(--card);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
        }
        .movie-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent2);
            box-shadow: 0 12px 30px rgba(229, 9, 20, 0.25);
        }
        .movie-card.active {
            border-color: var(--accent);
            box-shadow: 0 8px 25px rgba(229, 9, 20, 0.4);
            transform: translateY(-2px);
        }
        .movie-poster {
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            position: relative;
            letter-spacing: 1px;
        }
        .movie-poster::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
        }
        .movie-card .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent);
            color: #fff;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 2;
        }
        .movie-info {
            padding: 14px;
        }
        .movie-info h3 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }
        .movie-info p {
            color: var(--muted);
            font-size: 0.85rem;
        }
        /* Showtimes */
        .showtime-section {
            margin-bottom: 30px;
        }
        .times-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .time-btn {
            padding: 10px 20px;
            border-radius: 30px;
            border: 2px solid #444;
            background: transparent;
            color: var(--text);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        .time-btn:hover {
            border-color: var(--accent2);
            color: var(--accent2);
        }
        .time-btn.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
        }
        /* Screen */
        .screen {
            text-align: center;
            margin: 20px 0 30px;
            position: relative;
        }
        .screen-curve {
            width: 70%;
            height: 10px;
            background: linear-gradient(to bottom, #f5c518, #e50914);
            margin: 0 auto;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(245, 197, 24, 0.5);
            position: relative;
        }
        .screen-label {
            color: var(--muted);
            font-size: 0.8rem;
            letter-spacing: 3px;
            margin-top: 6px;
            text-transform: uppercase;
        }
        /* Seats Grid */
        .seats-section {
            margin-bottom: 30px;
        }
        .seats-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            max-width: 550px;
            margin: 0 auto;
        }
        .seat {
            aspect-ratio: 1;
            border-radius: 6px 6px 3px 3px;
            background: var(--available);
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: #666;
            font-weight: 700;
        }
        .seat:hover:not(.occupied) {
            background: #555;
            transform: scale(1.1);
        }
        .seat.selected {
            background: var(--selected);
            color: #fff;
            box-shadow: 0 0 12px rgba(229, 9, 20, 0.6);
            transform: scale(1.05);
        }
        .seat.occupied {
            background: var(--occupied);
            cursor: not-allowed;
            opacity: 0.5;
        }
        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--muted);
        }
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
        .legend-dot.available {
            background: var(--available);
        }
        .legend-dot.selected {
            background: var(--selected);
        }
        .legend-dot.occupied {
            background: var(--occupied);
        }
        /* Summary */
        .summary-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #333;
            animation: fadeUp 0.4s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .summary-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .summary-item label {
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .summary-item span {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent2);
        }
        .total-price {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent) !important;
        }
        .book-btn {
            padding: 14px 32px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(135deg, #e50914, #b00710);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.4);
        }
        .book-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.6);
        }
        .book-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: all;
        }
        .modal {
            background: var(--card);
            border-radius: var(--radius);
            padding: 30px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s;
            border: 1px solid #444;
        }
        .modal-overlay.show .modal {
            transform: scale(1);
        }
        .modal .tick {
            font-size: 4rem;
            display: block;
            animation: pop 0.5s ease;
        }
        @keyframes pop {
            0% {
                transform: scale(0);
            }
            70% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }
        .modal h2 {
            margin: 10px 0;
            color: var(--accent2);
        }
        .modal p {
            color: var(--muted);
            margin-bottom: 4px;
            font-size: 0.95rem;
        }
        .modal .close-btn {
            margin-top: 16px;
            padding: 10px 30px;
            border-radius: 30px;
            border: 2px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .modal .close-btn:hover {
            background: var(--accent);
            color: #fff;
        }
        /* Responsive */
        @media (max-width: 600px) {
            header h1 {
                font-size: 2.2rem;
            }
            .seats-grid {
                grid-template-columns: repeat(8, 1fr);
                gap: 5px;
            }
            .summary-card {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 CINEMAHUB</h1>
            <p>Book your movie tickets in seconds</p>
        </header>

        <!-- Movies -->
        <div class="movies-section">
            <h2>🎥 Now Showing</h2>
            <div class="movies-grid" id="moviesGrid"></div>
        </div>

        <!-- Showtimes -->
        <div class="showtime-section">
            <h2>🕐 Select Showtime</h2>
            <div class="times-row" id="timesRow"></div>
        </div>

        <!-- Screen -->
        <div class="screen">
            <div class="screen-curve"></div>
            <div class="screen-label">Screen this way</div>
        </div>

        <!-- Seats -->
        <div class="seats-section">
            <h2>💺 Select Your Seats</h2>
            <div class="seats-grid" id="seatsGrid"></div>
            <div class="legend">
                <div class="legend-item"><div class="legend-dot available"></div> Available</div>
                <div class="legend-item"><div class="legend-dot selected"></div> Selected</div>
                <div class="legend-item"><div class="legend-dot occupied"></div> Occupied</div>
            </div>
        </div>

        <!-- Summary -->
        <div class="summary-card" id="summaryCard">
            <div class="summary-item">
                <label>Movie</label>
                <span id="sumMovie">—</span>
            </div>
            <div class="summary-item">
                <label>Showtime</label>
                <span id="sumTime">—</span>
            </div>
            <div class="summary-item">
                <label>Seats</label>
                <span id="sumSeats">0 selected</span>
            </div>
            <div class="summary-item">
                <label>Total Price</label>
                <span class="total-price" id="sumPrice">$0.00</span>
            </div>
            <button class="book-btn" id="bookBtn" disabled>Book Tickets</button>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <span class="tick">✅</span>
            <h2>Booking Confirmed!</h2>
            <p id="modalMovie"></p>
            <p id="modalTime"></p>
            <p id="modalSeats"></p>
            <p id="modalPrice"></p>
            <button class="close-btn" onclick="closeModal()">Done</button>
        </div>
    </div>

    <script>
        const movies = [
            { id: 1, title: 'Dune: Part Two', poster: '🌌', color: 'linear-gradient(135deg, #e8a87c, #6b4f3c)', rating: 'PG-13', sessions: ['10:00 AM', '1:30 PM', '5:00 PM', '8:30 PM'] },
            { id: 2, title: 'Oppenheimer', poster: '💥', color: 'linear-gradient(135deg, #ff6b6b, #2d2d2d)', rating: 'R', sessions: ['11:00 AM', '2:30 PM', '6:00 PM', '9:30 PM'] },
            { id: 3, title: 'Barbie', poster: '🎀', color: 'linear-gradient(135deg, #ff9ff3, #ff6b6b)', rating: 'PG-13', sessions: ['12:00 PM', '3:00 PM', '7:00 PM'] },
            { id: 4, title: 'The Batman', poster: '🦇', color: 'linear-gradient(135deg, #4a4a4a, #1a1a1a)', rating: 'PG-13', sessions: ['10:30 AM', '2:00 PM', '5:30 PM', '9:00 PM'] },
        ];

        let selectedMovie = null;
        let selectedTime = null;
        let selectedSeats = new Set();
        const ticketPrice = 12.99;
        const totalSeats = 80;
        const occupiedSeats = generateOccupiedSeats(25);

        function generateOccupiedSeats(count) {
            const set = new Set();
            while (set.size < count) {
                set.add(Math.floor(Math.random() * totalSeats));
            }
            return set;
        }

        function renderMovies() {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = movies.map(movie => `
                <div class="movie-card ${selectedMovie?.id === movie.id ? 'active' : ''}"
                     onclick="selectMovie(${movie.id})">
                    <div class="badge">${movie.rating}</div>
                    <div class="movie-poster" style="background:${movie.color}">${movie.poster}</div>
                    <div class="movie-info">
                        <h3>${movie.title}</h3>
                        <p>${movie.sessions.length} shows daily</p>
                    </div>
                </div>
            `).join('');
        }

        function selectMovie(id) {
            selectedMovie = movies.find(m => m.id === id);
            selectedTime = null;
            selectedSeats.clear();
            renderMovies();
            renderTimes();
            renderSeats();
            updateSummary();
        }

        function renderTimes() {
            const row = document.getElementById('timesRow');
            if (!selectedMovie) {
                row.innerHTML = '<p style="color:#aaa;">👆 Select a movie first</p>';
                return;
            }
            row.innerHTML = selectedMovie.sessions.map(t => `
                <button class="time-btn ${selectedTime === t ? 'active' : ''}"
                        onclick="selectTime('${t}')">${t}</button>
            `).join('');
        }

        function selectTime(t) {
            selectedTime = t;
            renderTimes();
            updateSummary();
        }

        function renderSeats() {
            const grid = document.getElementById('seatsGrid');
            grid.innerHTML = '';
            for (let i = 0; i < totalSeats; i++) {
                const seat = document.createElement('button');
                seat.classList.add('seat');
                if (occupiedSeats.has(i)) seat.classList.add('occupied');
                if (selectedSeats.has(i)) seat.classList.add('selected');
                seat.textContent = `${String.fromCharCode(65 + Math.floor(i / 10))}${(i % 10) + 1}`;
                seat.addEventListener('click', () => toggleSeat(i));
                grid.appendChild(seat);
            }
        }

        function toggleSeat(index) {
            if (occupiedSeats.has(index)) return;
            if (selectedSeats.has(index)) {
                selectedSeats.delete(index);
            } else {
                selectedSeats.add(index);
            }
            renderSeats();
            updateSummary();
        }

        function updateSummary() {
            const seatArr = [...selectedSeats].sort((a, b) => a - b);
            const seatLabels = seatArr.map(i =>
                `${String.fromCharCode(65 + Math.floor(i / 10))}${(i % 10) + 1}`
            );

            document.getElementById('sumMovie').textContent = selectedMovie ? selectedMovie.title : '—';
            document.getElementById('sumTime').textContent = selectedTime || '—';
            document.getElementById('sumSeats').textContent =
                seatLabels.length ? seatLabels.join(', ') : '0 selected';
            document.getElementById('sumPrice').textContent =
                `$${(seatLabels.length * ticketPrice).toFixed(2)}`;

            const bookBtn = document.getElementById('bookBtn');
            bookBtn.disabled = !(selectedMovie && selectedTime && seatLabels.length > 0);
        }

        function bookTickets() {
            if (!selectedMovie || !selectedTime || selectedSeats.size === 0) return;
            const seatArr = [...selectedSeats].sort((a, b) => a - b);
            const seatLabels = seatArr.map(i =>
                `${String.fromCharCode(65 + Math.floor(i / 10))}${(i % 10) + 1}`
            );
            const total = (seatLabels.length * ticketPrice).toFixed(2);

            document.getElementById('modalMovie').textContent = `🎬 ${selectedMovie.title}`;
            document.getElementById('modalTime').textContent = `🕐 ${selectedTime}`;
            document.getElementById('modalSeats').textContent = `💺 Seats: ${seatLabels.join(', ')}`;
            document.getElementById('modalPrice').textContent = `💰 Total: $${total}`;
            document.getElementById('modalOverlay').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
            selectedSeats.clear();
            selectedTime = null;
            selectedMovie = null;
            renderMovies();
            renderTimes();
            renderSeats();
            updateSummary();
        }

        // Initialize
        renderMovies();
        renderTimes();
        renderSeats();
        updateSummary();

        document.getElementById('bookBtn').addEventListener('click', bookTickets);
    </script>
</body>
</html>
